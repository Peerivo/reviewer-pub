stages:
  - verify
  - release

verify-component:
  stage: verify
  image: alpine:3.20
  script:
    - test -f templates/reviewer.yml
    - grep -q "Peerivo Reviewer" templates/reviewer.yml
    - grep -q "/v1/ci/gitlab/review" templates/reviewer.yml
  rules:
    - if: '$CI_COMMIT_TAG'

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  script:
    - echo "Publishing Peerivo Reviewer ${CI_COMMIT_TAG} to the GitLab CI/CD Catalog"
  rules:
    - if: '$CI_COMMIT_TAG'
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Peerivo Reviewer CI/CD component $CI_COMMIT_TAG'
