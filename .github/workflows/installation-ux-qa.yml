name: Installation UX QA

on:
  pull_request:
    paths:
      - 'src/installation-*.mjs'
      - 'src/server.mjs'
      - 'tests/installation-*.mjs'
      - '.github/workflows/installation-ux-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installation-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm run check
      - name: Package tracked public source for local UI QA
        run: |
          mkdir -p installation-qa
          git archive --format=tar HEAD > installation-qa/source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installation-qa
          path: installation-qa/
          retention-days: 2
          if-no-files-found: error
