name: Installation Public Deploy Smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/installation-*.mjs'
      - 'src/server.mjs'
      - 'tests/installation-public-smoke.mjs'
      - '.github/workflows/installation-ux-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node tests/installation-public-smoke.mjs
