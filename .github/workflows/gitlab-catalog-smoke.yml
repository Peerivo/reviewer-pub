name: GitLab Catalog Public Smoke

on:
  pull_request:
    paths:
      - 'gitlab-catalog/**'
      - '.github/workflows/gitlab-catalog-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'gitlab-catalog/**'
      - '.github/workflows/gitlab-catalog-smoke.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Published GitLab catalog version to verify'
        required: true
        default: '1.0.3'
        type: string
      catalog_path:
        description: 'GitLab catalog project path'
        required: true
        default: 'peerivo/reviewer'
        type: string

permissions:
  contents: read

jobs:
  public-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CATALOG_VERSION: ${{ inputs.version || (github.event_name == 'push' && '1.0.3') || '1.0.2' }}
      CATALOG_PATH: ${{ inputs.catalog_path || (github.event_name == 'push' && 'peerivo/reviewer') || 'triombus/peerivo-reviewer' }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify public project, release and release pipeline
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const version = process.env.CATALOG_VERSION;
          assert.match(version, /^\d+\.\d+\.\d+$/);
          const base = 'https://gitlab.com/api/v4/projects/87175485';
          const get = async path => {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(30000), redirect: 'error' });
            assert.equal(response.status, 200, `GitLab ${path} status`);
            return response.json();
          };
          const project = await get('');
          assert.equal(project.path_with_namespace, process.env.CATALOG_PATH);
          assert.equal(project.visibility, 'public');
          // Anonymous REST omits cicd_catalog_enabled; the next step verifies actual catalog publication.
          const release = await get(`/releases/${version}`);
          assert.equal(release.tag_name, version);
          const pipelines = await get(`/pipelines?ref=${version}&per_page=20`);
          const pipeline = pipelines.find(item => item.sha === release.commit.id && item.status === 'success');
          assert.ok(pipeline, 'Successful release pipeline at the released SHA exists');
          const jobs = await get(`/pipelines/${pipeline.id}/jobs?per_page=100`);
          for (const name of ['verify-component', 'create-release']) {
            assert.ok(jobs.some(job => job.name === name && job.status === 'success'), `${name} succeeded`);
          }
          console.log(JSON.stringify({ project: project.web_url, version, pipeline: pipeline.web_url, jobs: 'verified' }));
          JS
      - name: Verify anonymously discoverable catalog component
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const query = 'query($path: ID!) { ciCatalogResource(fullPath: $path) { name webPath versions(first: 100) { nodes { name components { nodes { name } } } } } }';
          const response = await fetch('https://gitlab.com/api/graphql', {
            method: 'POST', redirect: 'error', signal: AbortSignal.timeout(30000),
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, variables: { path: process.env.CATALOG_PATH } })
          });
          assert.equal(response.status, 200);
          const result = await response.json();
          assert.ok(!result.errors, JSON.stringify(result.errors));
          const resource = result.data?.ciCatalogResource;
          assert.ok(resource, 'Catalog resource is visible without authentication');
          const version = resource.versions.nodes.find(item => item.name === process.env.CATALOG_VERSION);
          assert.ok(version, 'Release is published to the catalog, not merely tagged');
          assert.ok(version.components.nodes.some(item => item.name === 'reviewer'), 'reviewer component is published');
          console.log(JSON.stringify({ catalog: 'https://gitlab.com/explore/catalog/' + process.env.CATALOG_PATH, version: version.name, component: 'reviewer', anonymous: true }));
          JS
      - name: Verify hosted health and GitLab authorization entrypoint
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'https://pub.reviewer.peerivo.net';
          const health = await fetch(base + '/healthz', { redirect: 'error', signal: AbortSignal.timeout(30000) });
          assert.equal(health.status, 200);
          const start = async () => {
            const response = await fetch(base + '/connect/gitlab', { redirect: 'manual', signal: AbortSignal.timeout(30000) });
            assert.ok([302, 303].includes(response.status), 'OAuth entrypoint redirects');
            const target = new URL(response.headers.get('location'));
            assert.equal(target.origin, 'https://gitlab.com');
            assert.equal(target.pathname, '/oauth/authorize');
            assert.equal(target.searchParams.get('response_type'), 'code');
            assert.equal(target.searchParams.get('redirect_uri'), base + '/oauth/gitlab/callback');
            assert.ok(target.searchParams.get('scope').split(' ').includes('api'));
            assert.ok(target.searchParams.get('client_id'), 'Registered application is supplied');
            for (const name of ['client_secret', 'access_token', 'refresh_token']) {
              assert.equal(target.searchParams.has(name), false, 'Credentials must not appear in the authorization URL');
            }
            const state = target.searchParams.get('state');
            assert.ok(state && state.length >= 32, 'Unpredictable state is supplied');
            return state;
          };
          const first = await start();
          const second = await start();
          assert.notEqual(first, second, 'Each authorization gets a new state');
          console.log('Health: OK. GitLab OAuth: authorization code + fresh state + correct HTTPS callback; no tokens/client secret in redirect. No login or grant performed.');
          JS
